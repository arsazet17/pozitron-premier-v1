name: Premier audit

on:
  pull_request:
    paths: ['engine.js', 'scripts/premier-cycle.mjs', 'tests/premier-audit.mjs', '.github/workflows/premier-audit-test.yml']
  push:
    branches: [main]
    paths: ['engine.js', 'scripts/premier-cycle.mjs', 'tests/premier-audit.mjs', '.github/workflows/premier-audit-test.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/premier-audit.mjs
